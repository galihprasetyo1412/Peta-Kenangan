media:
  input: img
  output: /img

content:
  - name: posts
    label: "Journal (artikel panjang)"
    type: file
    path: data/posts.json
    format: json
    fields:
      - name: items
        label: "Artikel"
        type: object
        list: true
        fields:
          - name: title
            label: "Judul"
            type: string
            required: true
          - name: date
            label: "Tanggal"
            type: date
            required: true
          - name: tags
            label: "Label"
            type: string
            list: true
          - name: body
            label: "Isi tulisan (kosongkan satu baris antar paragraf; awali dengan ## untuk subjudul)"
            type: text
            required: true
          - name: slug
            label: "Alamat pendek (boleh dikosongkan)"
            type: string

  - name: notes
    label: "Notes (catatan pendek)"
    type: file
    path: data/notes.json
    format: json
    fields:
      - name: items
        label: "Catatan"
        type: object
        list: true
        fields:
          - name: type
            label: "Jenis"
            type: select
            required: true
            options:
              values: [quote, ide, harian, keluarga]
          - name: date
            label: "Tanggal"
            type: date
            required: true
          - name: text
            label: "Isi catatan"
            type: text
            required: true
          - name: by
            label: "Sumber (untuk quote; boleh kosong)"
            type: string

  - name: gallery
    label: "Gallery (foto)"
    type: file
    path: data/gallery.json
    format: json
    fields:
      - name: items
        label: "Foto"
        type: object
        list: true
        fields:
          - name: caption
            label: "Keterangan"
            type: string
            required: true
          - name: image
            label: "Unggah foto"
            type: image
          - name: url
            label: "Atau tautan foto (misalnya dari pCloud)"
            type: string
          - name: date
            label: "Tanggal (boleh dikosongkan)"
            type: date

  - name: media
    label: "Media (video dan dokumentasi)"
    type: file
    path: data/media.json
    format: json
    fields:
      - name: items
        label: "Media"
        type: object
        list: true
        fields:
          - name: type
            label: "Jenis"
            type: select
            options:
              values: [Video, Dokumentasi]
          - name: title
            label: "Judul"
            type: string
            required: true
          - name: desc
            label: "Deskripsi"
            type: text
          - name: youtube
            label: "ID video YouTube (bagian sesudah v=)"
            type: string
          - name: link
            label: "Tautan lain"
            type: string
          - name: date
            label: "Tanggal (boleh dikosongkan)"
            type: date

  - name: books
    label: "Reading List (buku)"
    type: file
    path: data/books.json
    format: json
    fields:
      - name: items
        label: "Buku"
        type: object
        list: true
        fields:
          - name: title
            label: "Judul"
            type: string
            required: true
          - name: author
            label: "Penulis"
            type: string
          - name: status
            label: "Status"
            type: select
            options:
              values: [reading, done, want]
          - name: note
            label: "Catatan singkat"
            type: text
          - name: image
            label: "Foto sampul atau foto saat membaca (boleh dikosongkan; disarankan lebar sekitar 600 px)"
            type: image
          - name: date
            label: "Tanggal mulai atau selesai baca (boleh dikosongkan)"
            type: date

  - name: about
    label: "About Me"
    type: file
    path: data/about.json
    format: json
    fields:
      - name: photo
        label: "Foto profil (boleh dikosongkan)"
        type: image
      - name: paras
        label: "Paragraf cerita (satu kotak untuk satu paragraf)"
        type: text
        list: true
      - name: facts
        label: "Sekilas (hal personal; pekerjaan dan pendidikan cukup di Resume)"
        type: object
        list: true
        fields:
          - name: label
            label: "Judul singkat (misalnya Tinggal di)"
            type: string
          - name: value
            label: "Isi"
            type: string

  - name: resume
    label: "Resume"
    type: file
    path: data/resume.json
    format: json
    fields:
      - name: edu
        label: "Pendidikan"
        type: object
        list: true
        fields:
          - name: title
            label: "Judul"
            type: string
          - name: org
            label: "Instansi atau tempat"
            type: string
          - name: period
            label: "Periode (misalnya 2019 sampai sekarang)"
            type: string
          - name: points
            label: "Poin tugas atau capaian"
            type: string
            list: true
      - name: work
        label: "Pekerjaan"
        type: object
        list: true
        fields:
          - name: title
            label: "Judul"
            type: string
          - name: org
            label: "Instansi atau tempat"
            type: string
          - name: period
            label: "Periode (misalnya 2019 sampai sekarang)"
            type: string
          - name: points
            label: "Poin tugas atau capaian"
            type: string
            list: true
      - name: exp
        label: "Pengalaman"
        type: object
        list: true
        fields:
          - name: title
            label: "Judul"
            type: string
          - name: org
            label: "Instansi atau tempat"
            type: string
          - name: period
            label: "Periode (misalnya 2019 sampai sekarang)"
            type: string
          - name: points
            label: "Poin tugas atau capaian"
            type: string
            list: true
      - name: skills
        label: "Kompetensi"
        type: string
        list: true
